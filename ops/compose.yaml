# "Production" for the drill. clinic-hours runs whichever release PROD_VERSION (ops/.env) names.
# Joins the Mattermost sandbox network (mm-pilot) so the monitor can post alerts.
name: drill-prod

services:
  clinic-hours:
    image: clinic-hours:${PROD_VERSION:?run ops/deploy.sh <tag> first}
    ports:
      - "127.0.0.1:8070:8070"
    networks: [mm-pilot]
    restart: "no"

  loadgen:
    build: ./loadgen
    networks: [mm-pilot]
    restart: "no"

  monitor:
    build: ./monitor
    env_file: monitor.env          # bot token, channel, display TZ; created by ops/init-monitor.sh, gitignored
    networks: [mm-pilot]
    restart: "no"

  relay:
    # Mattermost <-> GitHub. Mattermost's outgoing webhook and /incident command call http://relay:8080.
    build: ./relay
    env_file:                      # Mattermost bot tokens + GitHub token; created by ops/init-relay.sh, gitignored
      - path: relay.env
        required: false
    volumes:
      - relay-state:/data          # which Mattermost thread maps to which GitHub issue
    networks:
      mm-pilot:
        aliases: [relay]
    restart: "no"

volumes:
  relay-state:

networks:
  mm-pilot:
    name: mm-pilot_default
    external: true
